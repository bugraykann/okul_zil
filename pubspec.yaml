name: okul_zil
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  audioplayers: ^6.8.1
  excel: ^4.0.6
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  launch_at_startup: ^0.5.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  tray_manager: ^0.2.2
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  msix: ^3.18.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/icons/
    - assets/icon.png

flutter_launcher_icons:
  android: false
  ios: false
  macos:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48

msix_config:
  display_name: "OkulZilim"
  publisher_display_name: "Bugra Aykan"
  identity_name: "bugraykan.okulzilim"
  msix_version: 1.0.0.0
  logo_path: "assets/icon.png"
  capabilities: "internetClient"
